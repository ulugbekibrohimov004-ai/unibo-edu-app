<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>UNIBO Edu</title>
<style>
:root {
  --bg: var(--tg-theme-secondary-bg-color, #F4F7FC);
  --surface: var(--tg-theme-bg-color, #FFFFFF);
  --fg: var(--tg-theme-text-color, #17243C);
  --hint: var(--tg-theme-hint-color, #5F6C82);
  --accent: var(--tg-theme-button-color, #315CE8);
  --accent-fg: var(--tg-theme-button-text-color, #FFFFFF);
  --ink: #315CE8; --soft: #EEF3FF; --hero: #EAF1FF; --hero-end: #F7FAFF;
  --free: #157763; --free-bg: #E9F7F2; --warn: #A05D18; --danger: #C3424F;
  --line: rgba(106, 126, 159, .17); --shadow: 0 8px 30px rgba(30, 58, 110, .04);
  --font: "Onest", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
  --r: 20px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: var(--tg-theme-secondary-bg-color, #0E1728);
  --surface: var(--tg-theme-bg-color, #172338);
  --fg: var(--tg-theme-text-color, #EDF3FF);
  --hint: var(--tg-theme-hint-color, #A3B1C9);
  --accent: var(--tg-theme-button-color, #7F9CFF);
  --accent-fg: var(--tg-theme-button-text-color, #101B33);
  --ink: #A8BCFF; --soft: #243759; --hero: #21385C; --hero-end: #192840;
  --free: #84D9C4; --free-bg: #183C38; --warn: #E9B36B; --danger: #FF9CA5;
  --line: rgba(163, 185, 217, .19); --shadow: 0 8px 30px rgba(0, 0, 0, .08);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    --bg: #0E1728; --surface: #172338; --fg: #EDF3FF; --hint: #A3B1C9;
    --accent: #7F9CFF; --accent-fg: #101B33; --ink: #A8BCFF;
    --soft: #243759; --hero: #21385C; --hero-end: #192840;
    --free: #84D9C4; --free-bg: #183C38; --warn: #E9B36B; --danger: #FF9CA5;
    --line: rgba(163, 185, 217, .19); --shadow: 0 8px 30px rgba(0, 0, 0, .08);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); scroll-padding-top: 80px; }
body { margin: 0; color: var(--fg); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button, select { cursor: pointer; }
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { cursor: default; }
button, input, textarea, select { min-height: 44px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
button { transition: background .16s ease, border-color .16s ease, transform .16s ease, box-shadow .16s ease; }
button:active:not(:disabled) { transform: translateY(1px); }
svg.ic { display: block; width: 22px; height: 22px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 20px 120px; }
.top { display: flex; align-items: center; gap: 10px; padding: 12px 0; min-width: 0; }
.brand { display: inline-flex; align-items: center; flex: 1; min-width: 88px; }
.brand-logo { display: block; width: 88px; height: 88px; object-fit: contain; mix-blend-mode: multiply; }
:root[data-theme="dark"] .brand-logo { filter: invert(1) hue-rotate(180deg); mix-blend-mode: screen; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) .brand-logo { filter: invert(1) hue-rotate(180deg); mix-blend-mode: screen; }
}
.chip-bal { display: inline-flex; align-items: center; gap: 7px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); white-space: nowrap; font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
.chip-bal svg { width: 17px; height: 17px; color: var(--hint); }
.lang-select { width: 64px; padding: 0 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 12px; font-weight: 700; }
.home-hero { position: relative; overflow: hidden; padding: 25px 26px 22px; border-radius: 24px; background: linear-gradient(115deg, var(--hero), var(--hero-end)); border: 1px solid var(--line); }
.hero-inner { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 10px; align-items: center; }
.hero-kicker { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 10px; color: var(--ink); font-size: 11px; font-weight: 750; letter-spacing: .04em; }
.hero-kicker svg { width: 16px; height: 16px; }
h1 { font-size: clamp(27px, 5.2vw, 40px); font-weight: 800; letter-spacing: -.055em; line-height: 1.12; margin: 0 0 12px; text-wrap: balance; }
.hero-copy p { color: var(--hint); margin: 0; font-size: 13px; line-height: 1.65; max-width: 37ch; }
.hero-art { display: block; width: 100%; height: 220px; object-fit: contain; object-position: center; filter: drop-shadow(0 12px 16px rgba(42, 75, 144, .08)); }
.hero-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.btn-primary, .btn-secondary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 11px 16px; font-size: 13px; font-weight: 700; border: 1px solid transparent; }
.btn-primary { background: var(--accent); color: var(--accent-fg); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-primary svg, .btn-secondary svg { width: 17px; height: 17px; }
.search { position: relative; display: flex; align-items: center; margin-top: 20px; }
.search > svg { position: absolute; left: 16px; width: 21px; height: 21px; color: var(--hint); pointer-events: none; }
.search input { width: 100%; min-width: 0; height: 54px; padding: 14px 52px 14px 47px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); font-size: 14px; box-shadow: var(--shadow); }
.search input::placeholder { color: var(--hint); opacity: 1; }
.search input:focus { border-color: var(--accent); outline: 2px solid var(--soft); outline-offset: 1px; }
.search-clear { position: absolute; right: 5px; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 11px; background: transparent; color: var(--hint); }
.search-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 20px; padding: 5px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.search-modes button { border: 0; border-radius: 10px; padding: 9px 10px; background: transparent; color: var(--hint); font-size: 13px; font-weight: 650; line-height: 1.4; }
.search-modes button[aria-pressed="true"] { background: var(--soft); color: var(--ink); }
.search-form { display: block; margin-top: 0; }
.search-form .search { margin-top: 10px; }
.ai-search-panel { display: grid; gap: 11px; margin-top: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.ai-search-panel p { margin: 0; color: var(--hint); font-size: 13px; }
.ai-search-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; color: var(--hint); font-size: 11px; }
.ai-search-panel .btn-primary { width: 100%; min-height: 48px; }
.ai-search-panel .btn-primary:disabled { opacity: .5; }
.ai-age { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; font-size: 13px; cursor: pointer; }
.ai-age input { flex: 0 0 20px; width: 20px; height: 20px; min-height: 20px; margin: 0; accent-color: var(--accent); }
.search input[aria-invalid="true"] { border-color: var(--danger); }
.free-note { display: flex; align-items: flex-start; gap: 9px; padding: 12px 14px; margin-top: 12px; border-radius: 13px; background: var(--free-bg); color: var(--free); font-size: 12px; line-height: 1.55; }
.free-note svg { width: 18px; height: 18px; margin-top: 1px; }
.free-note.off { color: var(--hint); background: var(--surface); border: 1px solid var(--line); }
.section { margin-top: 27px; scroll-margin-top: 20px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
.section-head h2 { font-size: 18px; line-height: 1.3; letter-spacing: -.035em; margin: 0; font-weight: 750; }
.section-count { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; padding: 3px 8px; background: var(--soft); color: var(--ink); border-radius: 8px; font-size: 11px; font-weight: 700; }
.section-caption { color: var(--hint); margin: -3px 0 14px; font-size: 12px; }
.product-grid, .category-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pop { display: flex; flex-direction: column; min-width: 0; text-align: left; padding: 17px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 14px; }
.tile { display: grid; place-items: center; flex: 0 0 42px; width: 42px; height: 42px; border-radius: 13px; color: var(--ink); background: var(--soft); }
.tile[data-tone="free"] { background: var(--free-bg); color: var(--free); }
.card-arrow { color: var(--hint); opacity: .6; }
.card-arrow svg { width: 17px; height: 17px; }
.pop b { font-size: 14px; font-weight: 750; line-height: 1.3; margin-bottom: 5px; }
.pop .card-desc { font-size: 11.5px; line-height: 1.55; color: var(--hint); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 13px; }
.pop .card-price { font-size: 12px; font-weight: 700; margin-top: auto; color: var(--ink); }
.card-price.free { color: var(--free); }
.category-card { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 9px; text-align: left; border: 1px solid var(--line); border-radius: 18px; padding: 17px; background: var(--surface); min-width: 0; }
.category-card:last-child:nth-child(odd) { grid-column: 1 / -1; display: grid; grid-template-columns: 42px 1fr; column-gap: 13px; }
.category-card:last-child:nth-child(odd) .tile { grid-row: 1 / 3; }
.category-card:last-child:nth-child(odd) .category-name { align-self: end; }
.category-card:last-child:nth-child(odd) .category-sub { align-self: start; }
.category-name { font-size: 13px; font-weight: 750; line-height: 1.4; }
.category-sub { color: var(--hint); font-size: 11px; }
.category-card .card-arrow { position: absolute; right: 15px; top: 20px; }
.rail { display: flex; gap: 12px; overflow-x: auto; padding: 3px 2px 12px; scroll-snap-type: x mandatory; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.vcard { flex: 0 0 235px; scroll-snap-align: start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 0; overflow: hidden; }
.vcard .ph { display: block; position: relative; aspect-ratio: 16/9; overflow: hidden; background: var(--soft); }
.vcard .ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
.vcard .play { display: grid; place-items: center; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 44px; height: 44px; border-radius: 50%; color: #fff; background: rgba(15, 35, 70, .78); box-shadow: 0 3px 16px rgba(0,0,0,.15); }
.vcard .play svg { width: 20px; height: 20px; }
.vcard .duration { position: absolute; right: 9px; bottom: 9px; padding: 3px 7px; border-radius: 7px; color: #fff; background: rgba(15, 25, 45, .8); font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.video-copy { display: block; padding: 12px 13px 14px; }
.video-copy b { display: block; font-size: 13px; font-weight: 750; line-height: 1.4; margin-bottom: 4px; }
.video-copy > span { color: var(--hint); font-size: 11px; }
.list { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; padding: 15px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); text-align: left; }
.row .txt { min-width: 0; }
.row .name { font-size: 14px; font-weight: 700; line-height: 1.4; display: block; }
.row .desc { color: var(--hint); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; }
.price { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; color: var(--ink); }
.price.free { color: var(--free); }
.empty { text-align: center; padding: 30px 20px; border: 1px dashed var(--line); border-radius: 20px; background: var(--surface); }
.empty .tile { margin: 0 auto 14px; width: 56px; height: 56px; border-radius: 17px; }
.empty h3 { font-size: 17px; margin: 0 0 6px; }
.empty p { color: var(--hint); font-size: 13px; margin: 0 auto 18px; max-width: 34ch; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) 0 12px; background: var(--bg); }
.back { display: grid; place-items: center; flex: 0 0 44px; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); }
.bar .ttl { flex: 1; min-width: 0; color: var(--hint); font-size: 13px; font-weight: 650; }
.in-tg .back { display: none; }
.category-intro { padding: 10px 0 7px; }
.category-intro .tile { width: 52px; height: 52px; margin-bottom: 14px; border-radius: 16px; }
.category-intro h1 { font-size: 27px; margin-bottom: 8px; }
.category-intro p { color: var(--hint); margin: 0; font-size: 13px; }
.product-hero { padding: 18px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
.product-hero .hero-head { display: flex; align-items: flex-start; gap: 13px; }
.product-hero .tile { width: 50px; height: 50px; flex-basis: 50px; border-radius: 15px; }
.product-hero h1 { font-size: 23px; margin: 1px 0 7px; line-height: 1.2; }
.product-hero p { color: var(--hint); margin: 0; font-size: 13px; }
.order-summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 17px; padding-top: 14px; border-top: 1px solid var(--line); }
.order-summary > span { color: var(--hint); font-size: 12px; }
.order-summary strong { color: var(--ink); font-size: 17px; letter-spacing: -.025em; }
.order-summary strong.free { color: var(--free); }
.form-intro { display: flex; align-items: center; gap: 8px; color: var(--hint); font-size: 12px; margin: 18px 3px 0; }
.form-intro svg { width: 17px; height: 17px; }
form { display: grid; gap: 13px; margin-top: 15px; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 17px; padding: 16px; display: grid; gap: 10px; }
.field.bad { border-color: var(--danger); }
.q { white-space: pre-line; font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.q em { font-style: normal; font-weight: 500; font-size: 11px; color: var(--hint); }
.field input, .field textarea { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 11px 12px; outline: none; resize: vertical; font-size: 14px; }
.field input:focus, .field textarea:focus { border-color: var(--accent); outline: 2px solid var(--soft); }
.err { color: var(--danger); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--bg); padding: 10px 14px; border-radius: 11px; font-size: 13px; }
.chips button[aria-checked="true"] { background: var(--soft); color: var(--ink); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 650; }
.count { color: var(--hint); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
.tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); gap: 9px; }
.tier { position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 12px 28px 12px 12px; text-align: left; display: grid; gap: 5px; min-width: 0; }
.tier::after { content: ""; position: absolute; top: 14px; right: 11px; width: 12px; height: 12px; border: 1.5px solid var(--hint); border-radius: 50%; }
.tier b { font-size: 13px; font-weight: 700; }
.tier span { color: var(--hint); font-size: 12px; }
.tier s { color: var(--hint); margin-right: 5px; }
.tier .g { color: var(--free); font-weight: 700; }
.tier[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--soft); }
.tier[aria-checked="true"]::after { border: 3px solid var(--accent); background: var(--surface); }
.notes { display: grid; gap: 10px; font-size: 12px; color: var(--hint); padding: 4px 2px; }
.note { display: flex; align-items: flex-start; gap: 9px; padding: 2px 0; }
.note svg { width: 17px; height: 17px; margin-top: 1px; }
.notice { padding: 12px 14px; border-radius: 12px; font-size: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--hint); }
.notice.warn { color: var(--warn); border-color: currentColor; }
.cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 20px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -5px 20px rgba(27, 51, 94, .035); }
.cta-inner { display: flex; flex-direction: column; gap: 8px; max-width: 820px; margin: 0 auto; }
.cta-meta { display: flex; align-items: center; gap: 7px; color: var(--hint); font-size: 11px; }
.cta-meta svg { width: 14px; height: 14px; }
.cta button { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; border: 0; border-radius: 13px; padding: 14px; min-height: 50px; font-weight: 750; font-size: 14px; background: var(--accent); color: var(--accent-fg); }
.cta button svg { width: 18px; height: 18px; }
.cta button:disabled { opacity: .45; }
.in-tg .cta { display: none; }
.banner { margin: 20px 3px 0; color: var(--hint); font-size: 11px; line-height: 1.6; }
.vp { position: fixed; inset: 0; z-index: 50; background: rgba(7, 16, 34, .97); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 15px; overflow-y: auto; }
.vp video { display: block; width: 100%; max-width: 900px; max-height: 65vh; border-radius: 16px; background: #000; }
.vp .vt { color: #fff; font-weight: 650; text-align: center; max-width: 900px; }
.vp .vs { color: #D7E3F8; text-align: center; max-width: 900px; font-size: 13px; }
.vp .vs[data-state="error"] { color: #FFB9B9; }
.vp .row2 { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.vp button { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 650; }
.vp .go { background: var(--accent); color: var(--accent-fg); }
.vp .x { background: rgba(255,255,255,.13); color: #fff; }
dialog { border: 1px solid var(--line); border-radius: 20px; padding: 22px; background: var(--surface); color: var(--fg); width: min(520px, calc(100% - 32px)); }
dialog::backdrop { background: rgba(10, 20, 40, .5); }
dialog pre { background: var(--bg); padding: 13px; border-radius: 12px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
dialog h3 { margin: 0 0 9px; font-size: 19px; letter-spacing: -.025em; }
dialog p { margin: 0 0 12px; color: var(--hint); font-size: 13px; }
dialog button { border: 0; border-radius: 12px; padding: 10px 18px; background: var(--accent); color: var(--accent-fg); font-weight: 700; }
@media (hover: hover) {
  .pop:hover, .category-card:hover, .row:hover, .vcard:hover { border-color: var(--accent); box-shadow: 0 5px 18px rgba(49, 92, 232, .08); }
  .btn-primary:hover, .cta button:hover:not(:disabled) { filter: brightness(1.06); }
  .btn-secondary:hover, .back:hover, .search-clear:hover { background: var(--soft); }
}
@media (min-width: 720px) { .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .category-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .row { padding: 17px 19px; } }
@media (max-width: 520px) {
  .wrap { padding-inline: 16px; }
  .top { gap: 8px; }
  .chip-bal { padding: 8px; font-size: 11px; gap: 5px; }
  .chip-bal svg { display: none; }
  .lang-select { width: 56px; }
  .home-hero { padding: 21px 18px 19px; }
  .hero-inner { grid-template-columns: minmax(0, 1.18fr) minmax(0, .82fr); gap: 1px; }
  .hero-art { height: 190px; width: calc(100% + 14px); margin-left: -5px; }
  .hero-copy p { font-size: 12px; }
  .hero-actions { gap: 8px; }
  .hero-actions button { flex: 1; padding: 10px 9px; font-size: 12px; }
  .hero-actions button svg { width: 16px; height: 16px; }
  .pop, .category-card { padding: 14px; }
  .product-grid, .category-grid { gap: 10px; }
  .row { grid-template-columns: 40px minmax(0,1fr); gap: 11px; }
  .row .price { grid-column: 2; justify-self: start; margin-top: -3px; }
  .row .tile { grid-row: 1 / 3; }
  .cta { padding-inline: 16px; }
}
@media (max-width: 360px) {
  .chip-bal { font-size: 10px; padding: 7px; }
  .hero-inner { grid-template-columns: minmax(0, 1.3fr) minmax(0, .7fr); }
  h1 { font-size: 25px; }
  .hero-art { height: 165px; }
  .hero-kicker { font-size: 10px; }
  .hero-actions { flex-direction: column; align-items: stretch; }
  .hero-actions button { width: 100%; }
  .pop .card-desc { display: none; }

function money(n) {
  const num = lang === "en" ? n.toLocaleString("en-US") : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return `${num} ${CATALOG.currency[lang]}`;
}

function priceLabel(p) {
  if (p.tiers.some(giftTier)) return { text: L().gift, free: true };
  const min = Math.min(...p.tiers.map(t => t.price));
  return min === 0 ? { text: L().free, free: true } : { text: L().from(money(min)), free: false };
}
function locked(p) { return p.freeOnly && user.freeLeft <= 0; }

  if (inTg && tg.BackButton) { route.length > 1 ? tg.BackButton.show() : tg.BackButton.hide(); }

}

function icon(name) { return `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICONS[name] || ICONS.file}</svg>`; }
function categoryTitle(c) { return L().categories[c.key] || c.name[lang].replace(/^\S+\s+/, ""); }
function categoryIcon(key) { return { talaba: "cap", pedagog: "teacher", oquvchi: "book", bepul: "gift", hamshira: "heart" }[key] || "book"; }
function productIcon(p) {
  const k = p.key;
  if (k.includes("video")) return "play";
  if (k.includes("taqdimot")) return "slides";
  if (k.includes("test")) return "check";
  if (/masala|hisob|formula/.test(k)) return "calculator";
  if (/konspekt|glossariy|metodik|darslik/.test(k)) return "book";
  if (/flesh|krossvord/.test(k)) return "cards";
  if (p.cat === "hamshira") return "heart";
  return "file";
}
function sectionHead(title, count) { return `<div class="section-head"><h2>${esc(title)}</h2><span class="section-count">${count}</span></div>`; }
function freeNotice() { return `<div class="free-note${user.freeLeft > 0 ? "" : " off"}">${icon(user.freeLeft > 0 ? "gift" : "clock")}<span>${esc(user.freeLeft > 0 ? L().freeLeft(user.freeLeft) : L().freeOut)}</span></div>`; }
function productRow(p) {
  const pr = priceLabel(p);
  return `<button class="row" type="button" data-p="${p.key}">
    <span class="tile" data-tone="${isFreeCat(p) ? "free" : "blue"}">${icon(productIcon(p))}</span>
    <span class="txt"><span class="name">${esc(p.name[lang])}</span><span class="desc">${esc(p.desc[lang])}</span></span>
    <span class="price${pr.free ? " free" : ""}">${esc(pr.text)}</span></button>`;
}
function productCard(p) {
  const pr = priceLabel(p);
  return `<button class="pop" type="button" data-p="${p.key}"><span class="card-top"><span class="tile">${icon(productIcon(p))}</span><span class="card-arrow">${icon("arrow")}</span></span>
    <b>${esc(p.name[lang])}</b><span class="card-desc">${esc(p.desc[lang])}</span><span class="card-price${pr.free ? " free" : ""}">${esc(pr.text)}</span></button>`;
}
function categoryCard(c) {
  const items = CATALOG.products.filter(p => p.cat === c.key);
  const prices = items.map(p => Math.min(...p.tiers.map(t => t.price))).filter(x => x > 0);
  const sub = `${L().services(items.length)} · ${c.free || !prices.length ? L().free : L().from(money(Math.min(...prices)))}`;
  return `<button class="category-card" type="button" data-cat="${c.key}"><span class="tile" data-tone="${c.free ? "free" : "blue"}">${icon(categoryIcon(c.key))}</span>
    <span class="category-name">${esc(categoryTitle(c))}</span><span class="category-sub">${esc(sub)}</span><span class="card-arrow">${icon("arrow")}</span></button>`;
}
function videoRail() {

function setVideoStatus(state = "") {
  if (vp.hidden) return;
  vpStatus.dataset.state = state;
  vpStatus.textContent = state ? L()[{ loading: "videoLoading", error: "videoError", playHint: "videoPlayHint" }[state]] : "";
  vpStatus.hidden = !state;
}
function openVideo(i) {
  const v = (CATALOG.videos || [])[i]; if (!v) return;
  const opener = document.activeElement;
  closeVideo(false);
  const session = ++videoSession;
  videoFocus = opener;
  document.getElementById("vpT").textContent = v.title[lang] || v.title.uz;
  document.getElementById("vpGo").textContent = L().orderVideo; document.getElementById("vpX").textContent = L().close;
  vp.hidden = false;
  setVideoStatus("loading");
  vid.poster = v.poster || "";
  vid.src = v.src;
  vid.load();
  const playbackError = e => {
    if (session !== videoSession || vp.hidden || (e && e.name === "AbortError")) return;
    setVideoStatus(e && e.name === "NotAllowedError" ? "playHint" : "error");
  };
  try { const playing = vid.play(); if (playing && playing.catch) playing.catch(playbackError); } catch (e) { playbackError(e); }
  document.getElementById("vpX").focus();
  syncButton();
  haptic("sel");
}
function closeVideo(restoreFocus = true) {
  ++videoSession;
  vp.hidden = true;
  vid.pause();
  vid.removeAttribute("src");
  vid.removeAttribute("poster");
  vid.load();
  vpStatus.hidden = true;
  vpStatus.textContent = "";
  vpStatus.dataset.state = "";
  if (restoreFocus && videoFocus && videoFocus.isConnected) videoFocus.focus();
  videoFocus = null;
  syncButton();
}

  return `<section class="section">${sectionHead(l.popular, popular.length)}<div class="product-grid">${popular.map(productCard).join("")}</div></section>
    <section class="section" id="services" tabindex="-1">${sectionHead(l.sections, CATALOG.products.length)}<div class="category-grid">${CATALOG.cats.map(categoryCard).join("")}</div></section>${videoRail()}`;
}

  if (!input || !button) return;
  const length = aiQueryLength();
  button.disabled = !canSend || aiSubmitted || !aiAdult || length < 3 || length > 500;
  button.innerHTML = `${icon("spark")}${esc(aiSubmitted ? L().aiSending : L().aiSubmit)}`;
  input.disabled = aiSubmitted;
  document.getElementById("aiAdult").disabled = aiSubmitted;
  document.getElementById("aiCount").textContent = `${length} / 500`;
  document.getElementById("qClear").hidden = !aiQuery;
  if (resetError) {
    input.removeAttribute("aria-invalid");
    document.getElementById("aiAdult").removeAttribute("aria-invalid");
    document.getElementById("aiError").hidden = true;
    document.getElementById("aiError").textContent = "";
  }
}
function aiSearchError(message, invalid = false, target = "q") {
  const input = document.getElementById(target), error = document.getElementById("aiError");
  error.textContent = message;
  error.hidden = false;
  invalid ? input.setAttribute("aria-invalid", "true") : input.removeAttribute("aria-invalid");
  input.focus();
}
function setSearchMode(mode) {
  if (!["services", "ai"].includes(mode) || route[route.length - 1].s !== "home") return;
  searchMode = mode;
  render();
  document.getElementById("q").focus();
  haptic("sel");
}
function submitAISearch() {
  if (route[route.length - 1].s !== "home" || searchMode !== "ai" || !vp.hidden || aiSubmitted) return;
  if (!canSend) { aiSearchError(L().aiKeyboardOnly); haptic("warning"); return; }
  const length = aiQueryLength();
  if (length < 3 || length > 500) { aiSearchError(L().aiLength, true); haptic("error"); return; }
  if (!aiAdult) { aiSearchError(L().aiAdultRequired, true, "aiAdult"); haptic("error"); return; }
  const query = aiQuery.trim();
  if (inTg) {
    aiSubmitted = true;
    updateAISearch(true);
    try { tg.sendData(JSON.stringify({ action: "ai_search", q: query, l: lang, adult: true })); haptic("success"); }
    catch (e) { aiSubmitted = false; updateAISearch(); aiSearchError(L().aiSendError); haptic("error"); }
    return;
  }
  haptic("success");
  document.getElementById("dlgT").textContent = L().aiPreviewT;
  document.getElementById("dlgP").textContent = L().aiPreviewP;
  document.getElementById("dlgPre").textContent = query;
  document.getElementById("dlgOk").textContent = L().done;
  const dialog = document.getElementById("dlg");
  if (dialog.showModal) dialog.showModal(); else dialog.setAttribute("open", "");
}
function resetSearch() {
  if (searchMode === "ai") { aiQuery = ""; aiSubmitted = false; } else searchText = "";
  const input = document.getElementById("q");
  if (input) { input.value = ""; searchMode === "ai" ? updateAISearch(true) : updateHomeResults(); input.focus(); }
}
function scrollSection(id) {
  const section = document.getElementById(id);
  if (section) {
    section.focus({ preventScroll: true });
    section.scrollIntoView({ block: "start", behavior: window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
}
function renderHome() {
  const l = L(), ai = searchMode === "ai", value = ai ? aiQuery : searchText;
  const langs = `<select class="lang-select" id="uiLang" aria-label="${esc(l.language)}">${["uz", "ru", "en"].map(c => `<option value="${c}"${c === lang ? " selected" : ""}>${c.toUpperCase()}</option>`).join("")}</select>`;
  const bal = user.balance === null ? "" : `<span class="chip-bal" aria-label="${esc(l.balance + ": " + money(user.balance))}">${icon("wallet")}<span>${esc(money(user.balance))}</span></span>`;
  app.innerHTML = `<div class="screen"><header class="top"><span class="brand"><img class="brand-logo" src="assets/unibo-logo.png" alt="${esc(CATALOG.brand)}" width="1254" height="1254" decoding="async" fetchpriority="high"></span>${bal}${langs}</header>
    <section class="home-hero" id="homeHero"${ai || searchText.trim() ? " hidden" : ""}><div class="hero-inner"><div class="hero-copy"><div class="hero-kicker">${icon("spark")}${esc(l.kicker)}</div><h1>${esc(l.hello)}</h1><p>${esc(l.sub)}</p></div>
      <img class="hero-art" src="assets/edu-owl-hero.png" alt="" width="1254" height="1254" decoding="async" fetchpriority="high"></div>
      <div class="hero-actions"><button class="btn-primary" type="button" data-scroll="services">${esc(l.explore)}${icon("arrow")}</button>${(CATALOG.videos || []).length ? `<button class="btn-secondary" type="button" data-scroll="videoLessons">${icon("play")}${esc(l.watch)}</button>` : ""}</div></section>
    <div class="search-modes" role="group" aria-label="${esc(l.searchModes)}"><button type="button" data-search-mode="services" aria-pressed="${!ai}">${esc(l.serviceMode)}</button><button type="button" data-search-mode="ai" aria-pressed="${ai}">${esc(l.aiMode)}</button></div>
    <form class="search-form" id="searchForm" novalidate><div class="search">${icon("search")}<input id="q" type="search" autocomplete="off"${ai ? ' maxlength="500" aria-describedby="aiHint aiLength aiError"' : ''} placeholder="${esc(ai ? l.aiPlaceholder : l.search)}" value="${esc(value)}" aria-label="${esc(ai ? l.aiSearchLabel : l.searchLabel)}"><button class="search-clear" id="qClear" type="button" data-reset-search aria-label="${esc(l.clearSearch)}"${!value ? " hidden" : ""}>${icon("close")}</button></div>
      ${ai ? `<div class="ai-search-panel"><p id="aiHint">${esc(l.aiHint)}</p><div class="ai-search-meta"><span id="aiLength">${esc(l.aiLength)}</span><span id="aiCount">${aiQueryLength()} / 500</span></div><p id="aiAgeCaption">${esc(l.aiAgeCaption)}</p><label class="ai-age" for="aiAdult"><input id="aiAdult" type="checkbox" required${aiAdult ? " checked" : ""} aria-describedby="aiAgeCaption aiError"><span>${esc(l.aiAdultConfirm)}</span></label><div class="err" id="aiError" aria-live="polite" hidden></div>${!canSend ? `<div class="notice warn">${esc(l.aiKeyboardOnly)}</div>` : ""}<button class="btn-primary" id="aiSubmit" type="submit" disabled>${icon("spark")}${esc(l.aiSubmit)}</button></div>` : ""}</form>
    ${ai ? "" : freeNotice()}<main id="homeContent"${ai ? " hidden" : ""}>${homeBody()}</main>${inTg ? "" : `<p class="banner">${esc(ai ? l.aiPreviewMode : l.preview)}</p>`}</div>`;
  document.getElementById("q").addEventListener("input", e => {
    if (searchMode === "ai") { aiQuery = e.target.value; updateAISearch(true); }
    else { searchText = e.target.value; updateHomeResults(); }
  });
  document.getElementById("searchForm").addEventListener("submit", e => { e.preventDefault(); if (searchMode === "ai") submitAISearch(); });
  if (ai) document.getElementById("aiAdult").addEventListener("change", e => { aiAdult = e.target.checked; updateAISearch(true); });
  document.getElementById("uiLang").addEventListener("change", e => { lang = e.target.value; document.documentElement.lang = lang; render(); });
  if (ai) updateAISearch();
}
function renderCat(key) {
  const c = C[key], items = CATALOG.products.filter(p => p.cat === key), l = L();
  app.innerHTML = `<div class="screen"><div class="bar"><button class="back" type="button" data-back aria-label="${esc(l.back)}">${icon("back")}</button><span class="ttl">${esc(CATALOG.brand)}</span><span class="section-count">${items.length}</span></div>
    <header class="category-intro"><span class="tile" data-tone="${c.free ? "free" : "blue"}">${icon(categoryIcon(c.key))}</span><h1>${esc(categoryTitle(c))}</h1><p>${esc(l.services(items.length))}</p></header>
    ${c.free ? freeNotice() : ""}<section class="section"><div class="list">${items.map(productRow).join("")}</div></section></div>`;
}

/* ---------------- forma ---------------- */
function draft(p) {
  if (!drafts[p.key]) {
    const d = { tier: Math.max(0, p.tiers.findIndex(giftTier)), f: {} };
    p.fields.forEach(f => {
      if (f.key === "lang") d.f.lang = LANG_DEFAULT[lang];
      if (f.key === "vlang") d.f.vlang = VIDEO_LANG_DEFAULT[lang];
    });
    drafts[p.key] = d;
  }
  return drafts[p.key];
}
function tierPrice(p, i) { const t = p.tiers[i]; return giftTier(t) ? 0 : t.price; }

function renderForm(key) {
  const p = P[key], d = draft(p), l = L();
  const fields = p.fields.map(f => {
    const qtxt = `<${f.options ? "div" : "label"} class="q" id="q_${f.key}"${f.options ? "" : ` for="f_${f.key}"`}>${esc(f.q[lang])}${f.opt ? `<em>${esc(l.optional)}</em>` : ""}</${f.options ? "div" : "label"}>`;
    let ctl;
    if (f.options) {
      ctl = `<div class="chips" role="radiogroup" aria-labelledby="q_${f.key}">${f.options[lang].map((o, j) =>
        `<button type="button" role="radio" data-f="${f.key}" data-o="${j}" aria-checked="${d.f[f.key] === j}" tabindex="${d.f[f.key] === j || (typeof d.f[f.key] !== "number" && j === 0) ? 0 : -1}">${esc(o)}</button>`).join("")}</div>`;
    } else {
      const max = f.key === "topic" ? 300 : 1500;
      const v = esc(d.f[f.key] || ""), attrs = `id="f_${f.key}" data-t="${f.key}" maxlength="${max}" aria-labelledby="q_${f.key}" aria-describedby="err_${f.key}"${!f.opt ? ' required' : ''}`;
      ctl = (f.long || f.key === "topic") ? `<textarea ${attrs} rows="${f.long ? 4 : 2}">${v}</textarea>` : `<input ${attrs} value="${v}">`;
      if (f.long) ctl += `<div class="count" id="c_${f.key}">${(d.f[f.key] || "").length} / ${max}</div>`;
    }
    return `<div class="field" id="fld_${f.key}">${qtxt}${ctl}<div class="err" id="err_${f.key}" aria-live="polite" hidden></div></div>`;
  }).join("");
  const tiers = p.tiers.length > 1 ? `<div class="field"><div class="q" id="q_tier">${esc(l.size)}</div><div class="tiers" role="radiogroup" aria-labelledby="q_tier">${p.tiers.map((t, i) => {
    const pr = giftTier(t) ? `<s>${esc(money(t.price))}</s><span class="g">${esc(l.gift)}</span>` : (t.price ? esc(money(t.price)) : `<span class="g">${esc(l.free)}</span>`);
    return `<button type="button" class="tier" role="radio" data-tier="${i}" aria-checked="${d.tier === i}" tabindex="${d.tier === i ? 0 : -1}"><b>${esc(t.label[lang])}</b><span>${pr}</span></button>`;
  }).join("")}</div></div>` : "";
  const notes = [];
  if (locked(p)) notes.push(`<div class="notice warn">${esc(l.limitHit)}</div>`);
  if (!canSend) notes.push(`<div class="notice warn">${esc(l.keyboardOnly)}</div>`);
  if (p.plan) notes.push(`<div class="note">${icon("check")}<span>${esc(l.planNote)}</span></div>`);
  if (p.file) notes.push(`<div class="note">${icon("clip")}<span>${esc(l.fileNote)}</span></div>`);
  const price = tierPrice(p, d.tier);
  if (price > 0 && user.balance !== null && user.balance < price) notes.push(`<div class="notice">${esc(l.lowBal(money(user.balance)))}</div>`);
  app.innerHTML = `<div class="screen"><div class="bar"><button class="back" type="button" data-back aria-label="${esc(l.back)}">${icon("back")}</button><span class="ttl">${esc(categoryTitle(C[p.cat]))}</span></div>
    <header class="product-hero"><div class="hero-head"><span class="tile" data-tone="${isFreeCat(p) ? "free" : "blue"}">${icon(productIcon(p))}</span><div><h1>${esc(p.name[lang])}</h1><p>${esc(p.desc[lang])}</p></div></div>
      <div class="order-summary"><span>${esc(l.price)}<br><b>${esc(p.tiers[d.tier].label[lang])}</b></span><strong class="${price ? "" : "free"}">${esc(price ? money(price) : giftTier(p.tiers[d.tier]) ? l.gift : l.free)}</strong></div></header>
    ${p.key === "video_dars" ? videoRail() : ""}<p class="form-intro">${icon("chat")}<span>${esc(l.formHint)}</span></p>
    <form id="frm" novalidate>${tiers}${fields}<div class="notes">${notes.join("")}</div></form></div>`;
  app.querySelectorAll("[data-t]").forEach(el => el.addEventListener("input", () => {
    d.f[el.dataset.t] = el.value;
    const c = document.getElementById("c_" + el.dataset.t); if (c) c.textContent = `${el.value.length} / ${el.maxLength}`;
    clearErr(el.dataset.t);
    if (el.tagName === "TEXTAREA") { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
  }));
  document.getElementById("frm").addEventListener("submit", e => { e.preventDefault(); submit(); });
}

function clearErr(k) { const box = document.getElementById("fld_" + k); if (box) { box.classList.remove("bad"); box.querySelector(".err").hidden = true; const input = box.querySelector("input, textarea"); if (input) input.removeAttribute("aria-invalid"); } }
function setErr(k, msg) { const box = document.getElementById("fld_" + k); box.classList.add("bad"); const e = box.querySelector(".err"); e.textContent = msg; e.hidden = false; const input = box.querySelector("input, textarea"); if (input) input.setAttribute("aria-invalid", "true"); }

function payload(p) {
  const d = draft(p), l = L(); let bad = null;
  const f = {};
  for (const fd of p.fields) {
    let v = d.f[fd.key];
    if (fd.options) {
      if (typeof v === "number") f[fd.key] = v; else if (!fd.opt) { setErr(fd.key, l.need); bad = bad || fd.key; }
      continue;
    }
    v = (v || "").trim();
    if (!v) { if (!fd.opt) { setErr(fd.key, l.need); bad = bad || fd.key; } continue; }
    if (fd.key === "topic" && (v.length < 3 || v.length > 300)) { setErr(fd.key, l.topicLen); bad = bad || fd.key; continue; }
    f[fd.key] = v;
  }
  if (bad) { document.getElementById("fld_" + bad).scrollIntoView({ block: "center", behavior: "smooth" }); haptic("error"); return null; }
  const data = JSON.stringify({ v: 1, p: p.key, t: d.tier, l: lang, f });
  if (new TextEncoder().encode(data).length > 4000) {
    const longest = Object.keys(f).sort((a, b) => String(f[b]).length - String(f[a]).length)[0];
    setErr(longest, l.tooLong); haptic("error"); return null;
  }
  return data;
}

function submit() {
  const r = route[route.length - 1];
  if (r.s !== "form") return;
  const p = P[r.p];
  if (locked(p) || !canSend) { haptic("warning"); return; }
  const data = payload(p);
  if (!data) return;
  haptic("success");
  if (inTg) { tg.sendData(data); return; }
  document.getElementById("dlgT").textContent = L().sentT;
  document.getElementById("dlgP").textContent = L().sentP;
  const order = JSON.parse(data);
  const summary = [p.name[lang], p.tiers[order.t].label[lang], `${L().price}: ${tierPrice(p, order.t) ? money(tierPrice(p, order.t)) : L().free}`, ""];
  p.fields.forEach(fd => { const v = order.f[fd.key]; if (v !== undefined) summary.push(`${fd.q[lang]}\n${fd.options ? fd.options[lang][v] : v}\n`); });
  document.getElementById("dlgPre").textContent = summary.join("\n");
  document.getElementById("dlgOk").textContent = L().done;
  const dlg = document.getElementById("dlg");
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
}

function syncButton() {
  const r = route[route.length - 1];
  const show = r.s === "form" && vp.hidden;
  let text = "", enabled = false;
  if (show) {
    const p = P[r.p], price = tierPrice(p, draft(p).tier);
    text = price ? `${L().next} · ${money(price)}` : L().nextFree;
    enabled = !locked(p) && canSend;
  }
  if (inTg) {
    if (tg.BackButton) { route.length > 1 || !vp.hidden ? tg.BackButton.show() : tg.BackButton.hide(); }
    const mb = tg.MainButton;
    if (!show) { mb.hide(); return; }
    mb.setText(text);
    enabled ? mb.enable() : mb.disable();
    mb.show();
  } else {
    cta.hidden = !show;
    ctaBtn.innerHTML = `${esc(text)}${icon("arrow")}`;
    document.getElementById("ctaMeta").innerHTML = `${icon("chat")}<span>${esc(L().nextStep)}</span>`;
    ctaBtn.disabled = !enabled;
  }
}

/* ---------------- hodisalar ---------------- */
app.addEventListener("click", e => {
  const el = e.target.closest("button"); if (!el) return;
  if (el.dataset.searchMode) { setSearchMode(el.dataset.searchMode); return; }
  if (el.dataset.lang) { lang = el.dataset.lang; document.documentElement.lang = lang; render(); return; }
  if (el.hasAttribute("data-reset-search")) { resetSearch(); return; }
  if (el.dataset.scroll) { haptic("sel"); scrollSection(el.dataset.scroll); return; }
  if (el.hasAttribute("data-back")) { back(); return; }
  if (el.dataset.cat) { haptic("sel"); go({ s: "cat", cat: el.dataset.cat }); return; }
  if (el.dataset.p) { haptic("sel"); go({ s: "form", p: el.dataset.p }); return; }
  if (el.dataset.v) { openVideo(+el.dataset.v); return; }
  const r = route[route.length - 1]; if (r.s !== "form") return;
  const d = draft(P[r.p]);
  if (el.dataset.f) {
    const k = el.dataset.f, j = +el.dataset.o, fd = P[r.p].fields.find(x => x.key === k);
    d.f[k] = (fd.opt && d.f[k] === j) ? undefined : j;
    el.parentElement.querySelectorAll("button").forEach((b, i) => { b.setAttribute("aria-checked", String(d.f[k] === +b.dataset.o)); b.tabIndex = d.f[k] === +b.dataset.o || (d.f[k] === undefined && i === 0) ? 0 : -1; });
    clearErr(k); haptic("sel");
  } else if (el.dataset.tier) {
    d.tier = +el.dataset.tier; haptic("sel"); renderForm(r.p); syncButton(); const selected = app.querySelector(`[data-tier="${d.tier}"]`); if (selected) selected.focus({ preventScroll: true });
  }
});
app.addEventListener("keydown", e => {
  const el = e.target.closest('[role="radio"]');
  if (!el || !["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) return;
  const options = [...el.parentElement.querySelectorAll('[role="radio"]')], i = options.indexOf(el);
  const next = e.key === "Home" ? 0 : e.key === "End" ? options.length - 1 : (i + (["ArrowRight", "ArrowDown"].includes(e.key) ? 1 : -1) + options.length) % options.length;
  e.preventDefault();
  options[next].focus();
  options[next].click();
});
ctaBtn.addEventListener("click", submit);
document.getElementById("vpX").addEventListener("click", () => closeVideo());
document.addEventListener("keydown", e => { if (e.key === "Escape" && !vp.hidden) { e.preventDefault(); closeVideo(); } });
vid.addEventListener("waiting", () => { if (!vid.paused) setVideoStatus("loading"); });
vid.addEventListener("canplay", () => { if (vpStatus.dataset.state === "loading") setVideoStatus(); });
vid.addEventListener("playing", () => setVideoStatus());
vid.addEventListener("error", () => setVideoStatus("error"));
document.getElementById("vpGo").addEventListener("click", () => { closeVideo(); if (P.video_dars) { const r = route[route.length - 1]; if (!(r.s === "form" && r.p === "video_dars")) go({ s: "form", p: "video_dars" }); } });
document.getElementById("dlgOk").addEventListener("click", () => { const d = document.getElementById("dlg"); d.close ? d.close() : d.removeAttribute("open"); });

if (inTg) {
  document.documentElement.classList.add("in-tg");
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch (e) {}
  tg.MainButton.onClick(submit);
  if (tg.BackButton) tg.BackButton.onClick(back);
}
function applyTheme() { document.documentElement.dataset.theme = inTg && tg.colorScheme === "dark" ? "dark" : "light"; }
applyTheme();
if (inTg && tg.onEvent) tg.onEvent("themeChanged", applyTheme);
document.documentElement.lang = lang;
render();
</script>

</body>
